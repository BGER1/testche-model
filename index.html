<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Wohnungsfinder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./viewer.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>
  <div class="app">
    <div class="viewer-area">
      <div id="viewerCanvasWrapper"></div>

      <div class="loader" id="loader">
        <div class="loader-text" id="loaderInfo">Loading…</div>
        <div class="loader-spinner"></div>
      </div>
    </div>

    <aside class="panel">
      <div class="panel-header">
        <div class="panel-title">Wohnungsfinder</div>
        <div class="panel-subtitle">Übersicht & Details</div>
      </div>

      <div class="panel-section">
        <div class="section-title">Einheiten</div>

        <table class="info-table">
          <thead>
            <tr>
              <th>Wohnung</th>
              <th>Etage</th>
              <th>Größe</th>
              <th>Preis</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="infoRows"></tbody>
        </table>
      </div>

      <div class="panel-section detail-section">
        <div class="section-title">Details</div>

        <div id="detailsCard" class="details-card is-hidden">
          <div class="details-top">
            <div>
              <div class="details-title" id="detailsTitle">Wohnung</div>
              <div class="details-subtitle" id="detailsSubtitle">Etage</div>
            </div>
            <div id="detailsBadge" class="badge">Status</div>
          </div>

          <div class="details-grid">
            <div class="detail-item">
              <div class="detail-label">Größe</div>
              <div class="detail-value" id="detailsSize">—</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Preis</div>
              <div class="detail-value" id="detailsPrice">—</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Zimmer</div>
              <div class="detail-value" id="detailsRooms">—</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Verfügbarkeit</div>
              <div class="detail-value" id="detailsAvailability">—</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Ausrichtung</div>
              <div class="detail-value" id="detailsOrientation">—</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Freifläche</div>
              <div class="detail-value" id="detailsOutdoor">—</div>
            </div>
          </div>

          <div class="detail-description-wrap">
            <div class="detail-label">Beschreibung</div>
            <div class="detail-description" id="detailsDescription">—</div>
          </div>
        </div>
      </div>

      <div class="panel-note" id="panelNote">
        Hover zeigt den Wohnungsstatus farblich. Klick öffnet die Details rechts.
      </div>
    </aside>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
